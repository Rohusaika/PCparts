
name: Update PC parts prices

on:
  workflow_dispatch:
    inputs:
      resolve_missing_urls:
        description: "空欄の価格.com URLを自動検索する（初回・SKU追加時のみON）"
        required: true
        type: boolean
        default: false
      resolve_limit:
        description: "今回検索するURL件数（全件なら999）"
        required: true
        default: "999"
  schedule:
    # Every day at 09:10 JST (00:10 UTC). Scheduled runs do not search missing URLs.
    - cron: "10 0 * * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pc-parts-price-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: Tools/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r Tools/requirements.txt

      - name: Run parser safety tests
        working-directory: Tools
        run: python test_parser.py

      - name: Resolve missing Kakaku URLs
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.resolve_missing_urls }}
        working-directory: Tools
        run: |
          python resolve_kakaku_urls.py \
            --catalog catalog.csv \
            --report url_resolution_report.json \
            --limit "${{ inputs.resolve_limit }}" \
            --sleep 2.0

      - name: Update prices JSON
        working-directory: Tools
        run: |
          python update_prices.py \
            --mode mixed \
            --catalog catalog.csv \
            --manual manual_prices.csv \
            --history price_history.json \
            --shops approved_shops.txt \
            --output ../docs/prices.json \
            --sleep 2.5

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/prices.json Tools/price_history.json Tools/catalog.csv
          if [ -f Tools/url_resolution_report.json ]; then
            git add Tools/url_resolution_report.json
          fi
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update PC parts prices"
            git push
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
