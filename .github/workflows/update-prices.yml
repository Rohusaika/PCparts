name: Update PC parts prices

on:
  workflow_dispatch:
    inputs:
      audit_existing_urls:
        description: "既存URLが正しい製品ページか再検査する（今回の修正後はON推奨）"
        required: true
        type: boolean
        default: true
      resolve_missing_urls:
        description: "空欄のCPU用価格.com URLを厳密検索する（GPU・メモリ・SSD・HDDは一覧集計）"
        required: true
        type: boolean
        default: true
      resolve_limit:
        description: "今回検索するCPU URL件数（全件なら999）"
        required: true
        default: "999"
      reset_bad_history:
        description: "旧版の誤価格履歴を削除する（v1.4初回だけON）"
        required: true
        type: boolean
        default: true
  schedule:
    # Every day at 09:10 JST (00:10 UTC). Scheduled runs also resolve up to 12 missing CPU URLs.
    - cron: "10 0 * * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pc-parts-price-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: Tools/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r Tools/requirements.txt

      - name: Run parser safety tests
        working-directory: Tools
        run: python test_parser.py

      - name: Upgrade catalog to v1.5
        working-directory: Tools
        run: python upgrade_catalog_v1_5.py --catalog catalog.csv

      - name: Audit existing Kakaku URLs
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.audit_existing_urls }}
        working-directory: Tools
        run: |
          python resolve_kakaku_urls.py \
            --catalog catalog.csv \
            --report url_audit_report.json \
            --audit-existing \
            --limit 0 \
            --sleep 2.0

      - name: Resolve missing CPU Kakaku URLs
        if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.resolve_missing_urls) }}
        working-directory: Tools
        env:
          RESOLVE_LIMIT: ${{ github.event_name == 'schedule' && '12' || inputs.resolve_limit }}
        run: |
          python resolve_kakaku_urls.py \
            --catalog catalog.csv \
            --report url_resolution_report.json \
            --limit "$RESOLVE_LIMIT" \
            --sleep 2.0

      - name: Reset old invalid history
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.reset_bad_history }}
        run: rm -f Tools/price_history.json

      - name: Update prices JSON
        working-directory: Tools
        run: |
          python update_prices.py \
            --mode mixed \
            --catalog catalog.csv \
            --manual manual_prices.csv \
            --history price_history.json \
            --shops approved_shops.txt \
            --output ../docs/prices.json \
            --report last_update_report.json \
            --sleep 1.2 \
            --aggregate-pages 2

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/prices.json Tools/price_history.json Tools/catalog.csv Tools/last_update_report.json
          if [ -f Tools/url_audit_report.json ]; then git add Tools/url_audit_report.json; fi
          if [ -f Tools/url_resolution_report.json ]; then git add Tools/url_resolution_report.json; fi
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update verified PC parts prices"
            git push
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
