name: Update PC parts prices

on:
  workflow_dispatch:
  schedule:
    # 毎日09:10 JST（00:10 UTC）
    - cron: "10 0 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: Tools/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r Tools/requirements.txt

      - name: Update prices JSON
        working-directory: Tools
        run: |
          python update_prices.py \
            --mode mixed \
            --catalog catalog.csv \
            --manual manual_prices.csv \
            --history price_history.json \
            --shops approved_shops.txt \
            --output ../docs/prices.json

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/prices.json Tools/price_history.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update PC parts prices"
            git push
          fi
